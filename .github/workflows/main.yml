
name: Build Piggy World APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare build
        run: mkdir -p build

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: godot --headless --path . --export-debug "Android" build/PiggyWorld.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiggyWorld-Android-APK
          path: build/PiggyWorld.apk
          retention-days: 14
