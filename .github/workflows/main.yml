name: Build PiggyWorld APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/docker-config

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          mkdir -p /tmp/docker-config build

          godot --version
          java -version

          test -f /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -d /usr/lib/android-sdk/build-tools/33.0.2
          test -f /root/debug.keystore

          echo "Environment ready!"

      - name: Configure Godot Android settings
        run: |
          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          cat /root/.config/godot/editor_settings-4.4.tres
          echo "Godot Android settings configured!"

      - name: Import project
        run: |
          godot --headless --verbose --path . --import

      - name: Runtime gameplay smoke test
        run: |
          set +e
          godot --headless --verbose --path . --script scripts/dev/smoke_test.gd > runtime.log 2>&1
          status=$?
          set -e

          cat runtime.log

          if [ "$status" -ne 0 ]; then
            echo "Godot gameplay smoke test exited with status $status."
            exit 1
          fi

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" runtime.log; then
            echo "Godot runtime test reported an error. APK export is blocked."
            exit 1
          fi

          if ! grep -q "SMOKE_OK:" runtime.log; then
            echo "Gameplay smoke test did not reach its success marker."
            exit 1
          fi

          echo "Gameplay smoke test passed."

      - name: Build APK
        run: |
          godot --headless --verbose --path . --export-debug "Android" build/PiggyWorld.apk
          test -s build/PiggyWorld.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiggyWorld-Android
          path: build/PiggyWorld.apk
          if-no-files-found: error
