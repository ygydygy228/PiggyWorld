</g>
<!-- tilled soil -->
<g transform="translate(80 0)">
<rect width="16" height="16" fill="#96613e"/><path d="M2 0v16 M7 0v16 M12 0v16" stroke="#75472f" stroke-width="2"/><path d="M3 0v16 M8 0v16 M13 0v16" stroke="#b77a4c" stroke-width="1"/>
</g>
<!-- seedling -->
<g transform="translate(96 0)">
<rect width="16" height="16" fill="#70b85c"/><rect x="7" y="9" width="2" height="5" fill="#397a43"/><path d="M8 10L3 6L4 4L9 9L12 4L14 5L9 11Z" fill="#398b49"/><rect x="3" y="5" width="3" height="2" fill="#78c965"/>
</g>
<!-- mature crop -->
<g transform="translate(112 0)">
<rect width="16" height="16" fill="#70b85c"/><rect x="7" y="7" width="2" height="8" fill="#397a43"/><path d="M8 10L2 6L3 4L9 9L13 3L15 4L9 11Z" fill="#2f7d43"/><rect x="2" y="4" width="4" height="2" fill="#8bd16a"/><rect x="12" y="3" width="3" height="2" fill="#8bd16a"/><rect x="6" y="6" width="4" height="3" fill="#f0c84e"/>
</g>
