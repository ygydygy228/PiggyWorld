<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
<rect width="128" height="128" fill="#253c32"/>
<!-- grass -->
<g transform="translate(0 0)">
<rect width="16" height="16" fill="#70b85c"/><rect x="2" y="3" width="3" height="2" fill="#82c96b"/><rect x="10" y="2" width="2" height="3" fill="#559b4d"/><rect x="6" y="10" width="3" height="2" fill="#5da44e"/><rect x="12" y="12" width="2" height="2" fill="#8acb70"/><rect x="1" y="13" width="2" height="1" fill="#4d9148"/>
</g>
<!-- grass flowers -->
<g transform="translate(16 0)">
<rect width="16" height="16" fill="#70b85c"/><rect x="3" y="4" width="2" height="2" fill="#fff0b5"/><rect x="2" y="5" width="4" height="1" fill="#f6d77d"/><rect x="11" y="10" width="2" height="2" fill="#fff0b5"/><rect x="10" y="11" width="4" height="1" fill="#f6d77d"/><rect x="7" y="2" width="2" height="3" fill="#559b4d"/>
