<g transform="translate(0 16)">
<rect width="16" height="16" fill="#70b85c"/><rect x="3" y="4" width="2" height="5" fill="#4c944b"/><rect x="4" y="3" width="2" height="2" fill="#80c96a"/><rect x="11" y="10" width="2" height="4" fill="#4c944b"/>
</g>
<g transform="translate(16 16)">
